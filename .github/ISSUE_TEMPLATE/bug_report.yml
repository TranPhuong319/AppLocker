name: Bug Report
description: Report an issue or unexpected behavior in AppLocker
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue with AppLocker!
        Please fill out the form below as completely as possible to help us reproduce and resolve the problem quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps are needed to reproduce this behavior?
      placeholder: |
        1. Open AppLocker
        2. Lock application '...'
        3. Attempt to launch '...'
        4. See error or unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: macos_version
    attributes:
      label: macOS Version
      description: Which version of macOS are you running?
      options:
        - "macOS 27 Golden Gate (27.x)"
        - "macOS 26 Tahoe (26.x)"
        - "macOS 15 Sequoia (15.x)"
        - "macOS 14 Sonoma (14.x)"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Hardware Architecture
      description: What processor architecture is your Mac using?
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4 / M5)"
        - "Intel (x86_64)"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: AppLocker Version
      description: The version of AppLocker where this issue occurred (e.g., from AppLocker > About).
      placeholder: "e.g. 1.10.0"
    validations:
      required: true

  - type: dropdown
    id: target_app_type
    attributes:
      label: Target Application Type
      description: What kind of application is experiencing the issue?
      options:
        - "Third-Party App (e.g. Chrome, Discord, VS Code)"
        - "Apple System App (e.g. Safari, Mail, Terminal, System Settings)"
        - "Mac App Store App"
        - "Command-line tool or custom executable"
        - "General / Not app-specific"

  - type: checkboxes
    id: security_status
    attributes:
      label: Security & Extension Status
      description: Select the options that apply to your system configuration.
      options:
        - label: "System Integrity Protection (SIP) is enabled"
        - label: "AppLocker System Extension is approved and running (System Settings > General > Login Items & Extensions)"
        - label: "AppLocker has been granted Full Disk Access (System Settings > Privacy & Security > Full Disk Access)"

  - type: dropdown
    id: auth_method
    attributes:
      label: Primary Authentication Method
      description: How do you unlock locked applications?
      options:
        - "Touch ID (Biometrics)"
        - "macOS User Password"
        - "Apple Watch"
        - "None / Not reached"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Crash Reports
      description: Paste any relevant output from Console.app, os_log, or crash reports here.
      render: shell
      placeholder: |
        # Command to filter logs from both Main App and Endpoint Security Extension:
        # log show --predicate 'subsystem BEGINSWITH "com.TranPhuong319.AppLocker"' --last 5m

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or screen recordings about the problem.
